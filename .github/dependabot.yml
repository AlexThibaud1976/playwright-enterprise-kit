# Keeps npm dependencies (root kit + MCP server) and GitHub Actions current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @types/node must match the Node.js runtime (Node 24 LTS in CI):
      # newer majors would type-check APIs that don't exist at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      playwright:
        patterns: ["@playwright/test", "playwright"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
    ignore:
      # @types/node must match the Node.js runtime (Node 24 LTS in CI):
      # newer majors would type-check APIs that don't exist at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
